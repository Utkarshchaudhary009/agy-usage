name: "3. Orchestrator: Review Judge Agent"

on:
  repository_dispatch:
    types: [trigger-review-judge]

jobs:
  judge-reviews:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Kilo Code CLI
        run: |
          npm install -g @kilocode/cli@latest
          chmod +x kilocode-runner.sh

      - name: Fetch PR Reviews
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh pr view ${{ github.event.client_payload.pr_number }} --json reviews,comments > pr_reviews.json

      - name: Run Kilo Code Judge
        run: |
          ./kilocode-runner.sh \
            "You are the Review Judge Agent.
             PR Reviews: $(cat pr_reviews.json)
             Analyze all submitted reviews. Filter out duplicates and false positives.
             Output JSON in a block to 'findings.json':
             { \"status\": \"changes_required\" | \"approved\", \"findings\": [ { \"file\": \"...\", \"problem\": \"...\", \"action\": \"...\" } ] }"

      - name: Parse Judge Output with Fallback & Update State
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.client_payload.pr_number;
            let judgeResult = { status: "approved", findings: [] };

            // Robust JSON Extractor (Handles markdown wrapper noise)
            if (fs.existsSync('findings.json')) {
              try {
                const raw = fs.readFileSync('findings.json', 'utf8');
                const match = raw.match(/(\{[\s\S]*\}|\[[\s\S]*\])/);
                if (match) judgeResult = JSON.parse(match[0]);
              } catch (e) {
                console.warn("Failed to parse Judge JSON. Defaulting to approved.", e);
              }
            }

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const stateComment = comments.data.find(c => c.body.includes('<!-- ORCHESTRATOR_STATE:'));
            let state = JSON.parse(stateComment.body.match(/<!-- ORCHESTRATOR_STATE:\s*({[\s\S]*?})\s*-->/)[1]);

            if (judgeResult.status === 'changes_required' && judgeResult.findings.length > 0) {
              state.phase = 'FIXING_REVIEWS';
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: 'trigger-fixer',
                client_payload: { pr_number: prNumber, findings: judgeResult.findings }
              });
            } else {
              state.phase = 'REVIEWS_APPROVED';
              state.gates.reviews_passed = true;
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: 'check-merge-gate',
                client_payload: { pr_number: prNumber }
              });
            }

            state.version = (state.version || 1) + 1;
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: stateComment.id,
              body: `<!-- ORCHESTRATOR_STATE:\n${JSON.stringify(state, null, 2)}\n-->\n⚖️ **Review Judge Decision:** \`${judgeResult.status}\``
            });