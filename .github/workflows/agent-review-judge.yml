name: "3. Orchestrator: Review Judge Agent"

on:
  repository_dispatch:
    types: [trigger-review-judge]

jobs:
  judge-reviews:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.head_sha }}

      - name: Install Kilo Code CLI
        run: |
          npm install -g @kilocode/cli@latest
          chmod +x kilocode-runner.sh

      - name: Fetch PR Reviews
        if: ${{ github.event.client_payload.post_fix != true }}
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh pr view ${{ github.event.client_payload.pr_number }} --json reviews,comments > pr_reviews.json

      - name: Run Kilo Code Judge
        run: |
          if [ "${{ github.event.client_payload.post_fix }}" == "true" ]; then
            PROMPT="You are the Review Judge Agent performing a POST-FIX verification. Do a FRESH code review of the current changes in this repository (review the modified files, or run 'git --no-pager diff origin/main...HEAD'). Do NOT rely on any previous review comments. Verify whether the previously reported issues are now resolved and that no new blocking issues were introduced. Output JSON in a block to 'findings.json': { \"status\": \"changes_required\" | \"approved\", \"findings\": [ { \"file\": \"...\", \"problem\": \"...\", \"action\": \"...\" } ] }. If everything looks correct, set status to \"approved\" with an empty findings array."
          else
            PROMPT="You are the Review Judge Agent. PR Reviews: $(cat pr_reviews.json). Analyze all submitted reviews. Filter out duplicates and false positives. Output JSON in a block to 'findings.json': { \"status\": \"changes_required\" | \"approved\", \"findings\": [ { \"file\": \"...\", \"problem\": \"...\", \"action\": \"...\" } ] }"
          fi
          ./kilocode-runner.sh "$PROMPT"

      - name: Parse Judge Output with Fallback & Update State
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.client_payload.pr_number;
            const isPostFix = context.payload.client_payload.post_fix === true;
            let judgeResult = { status: "approved", findings: [] };
            if (fs.existsSync('findings.json')) {
              try {
                const raw = fs.readFileSync('findings.json', 'utf8');
                const match = raw.match(/(\{[\s\S]*\}|\[[\s\S]*\])/);
                if (match) judgeResult = JSON.parse(match[0]);
              } catch (e) {
                console.warn("Failed to parse Judge JSON. Defaulting to approved.", e);
              }
            }

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            const stateComment = comments.data.find(c => c.body.includes('<!-- ORCHESTRATOR_STATE:'));
            let state = JSON.parse(stateComment.body.match(/<!-- ORCHESTRATOR_STATE:\s*({[\s\S]*?})\s*-->/)[1]);

            const postFixRounds = (state.reviews.post_fix_rounds || 0);
            const changesRequired = judgeResult.status === 'changes_required' && judgeResult.findings.length > 0;

            if (changesRequired && !(isPostFix && postFixRounds >= 2)) {
              // More fixes needed (and we haven't exhausted the 2 post-fix rounds)
              state.phase = 'FIXING_REVIEWS';
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: 'trigger-fixer',
                client_payload: { pr_number: prNumber, findings: judgeResult.findings }
              });
            } else {
              if (changesRequired && isPostFix && postFixRounds >= 2) {
                console.log("Post-fix verification exhausted (2 rounds). Accepting and proceeding to merge gate.");
              }
              // Approved (or we gave it 2 chances post-fix) -> reviews pass, move to merge gate
              state.phase = 'REVIEWS_APPROVED';
              state.gates.reviews_passed = true;
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: 'check-merge-gate',
                client_payload: { pr_number: prNumber }
              });
            }

            state.version = (state.version || 1) + 1;
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: stateComment.id,
              body: `<!-- ORCHESTRATOR_STATE:\n${JSON.stringify(state, null, 2)}\n-->\n⚖️ **Review Judge Decision:** \`${judgeResult.status}\`${isPostFix ? ' (post-fix verification round ' + postFixRounds + '/2)' : ''}`
            });
