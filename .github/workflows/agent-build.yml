name: "1. Agent Build & PR"

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: "Coding task (blank = Start the Next Phase)"
        required: false
        type: string

concurrency:
  group: agent-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/agent-setup

      - name: Run Builder Agent
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TASK="${{ inputs.task }}"
          if [ -z "$TASK" ]; then
            TASK="Implement the next phase"
          fi
          ./kilocode-runner.sh "You are Autonomous Kilobot. $TASK"

      - name: Install Quality Skills (best-effort)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          bunx skills add vercel/next.js --agent kilo -y --skill '*' || true
          bunx skills add maddhruv/absolute --agent kilo -y --skill absolute-audit || true
          bunx skills add mattpocock/skills --agent kilo -y --skill improve-codebase-architecture || true
          bunx skills add vercel-labs/agent-skills --agent kilo -y --skill vercel-react-best-practices || true
          bunx skills add clerk/skills --agent kilo -y --skill '*' || true
          bunx skills add supabase/agent-skills --agent kilo -y --skill '*' || true
          bunx skills add addyosmani/agent-skills --agent kilo -y --skill code-review-and-quality || true

      - name: Quality Gate (8 serial review agents)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          PASSES=(
            "security vulnerabilities (injection, XSS, and other OWASP issues)"
            "architecture and design quality (simplicity, efficiency, robust modularity)"
            "maintainability"
            "race conditions"
            "Next.js best practices"
            "React best practices"
            "Clerk best practices"
            "Supabase best practices"
          )
          for PASS in "${PASSES[@]}"; do
            echo "=== Quality pass: $PASS ==="
            ./kilocode-runner.sh "You are a Senior Developer. Review the code changes for $PASS. Fix all issues found."
          done

      - name: Verify Build (with rescue pass)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if ! npx next build; then
            echo "Build failed. Running rescue agent..."
            ./kilocode-runner.sh "You are a Senior Developer. The build is failing. Fix all build errors."
            npx next build
          fi

      - name: Ensure Feature Branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=$(git branch --show-current)
          if [ "$BRANCH" = "main" ]; then
            git checkout -b "phase-$(date +%s)"
            echo "Created branch: $(git branch --show-current)"
          fi

      - name: Restore Local AGENTS.md (never commit CI copy)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git update-index --no-skip-worktree AGENTS.md
          git checkout -- AGENTS.md
          git update-index --skip-worktree AGENTS.md

      - name: Run Submit Agent
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ./kilocode-runner.sh "You are a Senior Developer. Commit all changes and create a detailed PR. After running 'gh pr create', write ONLY the PR URL to a file called 'pr_url.txt'."

      - name: Initialize Orchestrator State
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f pr_url.txt ]; then
            echo "Agent did not produce pr_url.txt. Falling back."
            BRANCH=$(git branch --show-current)
            git add -A
            if git diff --staged --quiet; then echo "No changes to commit." && exit 1; fi
            git commit -m "feat: autonomous next phase [kilocode-bot]"
            git push origin "$BRANCH"
            PR_URL=$(gh pr create --head "$BRANCH" --base main --title "Autonomous Next Phase" --body "Autonomous PR by kilocode-bot.")
          else
            PR_URL=$(cat pr_url.txt | tr -d '[:space:]')
          fi

          PR_NUMBER=$(echo "$PR_URL" | awk -F'/' '{print $NF}')
          HEAD_SHA=$(git rev-parse HEAD)
          BRANCH=$(git branch --show-current)

          gh pr comment "$PR_NUMBER" --body "<!-- ORCHESTRATOR_STATE:
          {
            \"version\": 1, \"run_id\": \"task-$(date +%s)\",
            \"pr_number\": $PR_NUMBER, \"head_sha\": \"$HEAD_SHA\", \"branch\": \"$BRANCH\",
            \"phase\": \"WAITING_FOR_REVIEWS\", \"review_round\": 1,
            \"reviews\": { \"required\": [\"cubic-dev-ai[bot]\", \"sourcery-ai[bot]\"], \"completed\": {}, \"post_fix_rounds\": 0 },
            \"deployment\": { \"status\": \"pending\", \"sha\": \"$HEAD_SHA\" },
            \"gates\": { \"deployment_passed\": false, \"reviews_passed\": false },
            \"attempts\": { \"total_agent_runs\": 1, \"max_limit\": 10 },
            \"processed_event_ids\": []
          }
          -->
          Autonomous Orchestrator Initialized (v1)."
