name: "1. Agent Build & Branch"

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: "Coding task (blank = Start the Next Phase)"
        required: false
        type: string

concurrency:
  group: agent-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/agent-setup

      - name: Run Builder Agent
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TASK="${{ inputs.task }}"
          if [ -z "$TASK" ]; then
            TASK="Implement the next phase"
          fi
          ./kilocode-runner.sh "You are Autonomous Kilobot. $TASK"

      - name: Verify Build (with rescue pass)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if ! npx next build; then
            echo "Build failed. Running rescue agent..."
            ./kilocode-runner.sh "You are a Senior Developer. The build is failing. Fix all build errors."
            npx next build
          fi

      - name: Create Branch & Commit Builder Output
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=$(git branch --show-current)
          if [ "$BRANCH" = "main" ]; then
            git checkout -b "phase-$(date +%s)"
            BRANCH=$(git branch --show-current)
            echo "Created branch: $BRANCH"
          fi

          git update-index --no-skip-worktree AGENTS.md
          git checkout -- AGENTS.md
          git update-index --skip-worktree AGENTS.md

          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "feat: autonomous next phase [kilocode-bot]"
            echo "Committed builder output."
          else
            echo "No new changes from builder."
          fi
          git push -u origin "$BRANCH"

          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Dispatch Quality Gate 1
        uses: actions/github-script@v7
        env:
          BRANCH: ${{ env.BRANCH }}
          HEAD_SHA: ${{ env.HEAD_SHA }}
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner, repo: context.repo.repo,
              event_type: 'quality-gate',
              client_payload: {
                run_id: `phase-${Date.now()}`,
                branch: process.env.BRANCH,
                head_sha: process.env.HEAD_SHA,
                gate_index: 1,
                failed_gates: ''
              }
            });