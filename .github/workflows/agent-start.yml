name: "1. Orchestrator: Agent Start & Builder"

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      task:
        description: "Coding task description for Kilo Code (leave blank to just start next phase)"
        required: false
        type: string

jobs:
  build-and-open-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Project Dependencies
        run: bun install

      - name: Install Kilo Code CLI
        run: npm install -g @kilocode/cli@latest

      - name: Create Feature Branch
        run: |
          BRANCH_NAME="feature/task-$(date +%s)"
          git config user.name "kilocode-bot"
          git config user.email "bot@kilocode.ai"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Run Kilo Code Builder Agent
        run: |
          TASK_INPUT="${{ inputs.task }}"
          
          if [ -z "$TASK_INPUT" ]; then
            PROMPT="You are implementing the Wakeup feature for this Next.js dashboard. Create the file src/lib/wakeup/cooldown.ts that exports two pure TypeScript functions: (1) isInCooldown(lastTriggeredAt: string | null, cooldownMs: number): boolean — returns true when (Date.now() - new Date(lastTriggeredAt).getTime()) < cooldownMs, and false when lastTriggeredAt is null; (2) remainingCooldownMs(lastTriggeredAt: string | null, cooldownMs: number): number — returns Math.max(0, cooldownMs - (Date.now() - new Date(lastTriggeredAt).getTime())), or 0 when lastTriggeredAt is null. Add 'import \"server-only\";' as the first line. Then run 'bun run lint' and 'bun x tsc --noEmit' and fix every error. Finally, check off the corresponding task in docs/plans/implementation-plan.md. Make the actual file edit — produce a real, compiling file, not just a description. Do NOT run bun build or bun dev. Do not run git commit, git push, or gh commands yourself — the workflow handles version control and PR creation."
          else
            PROMPT="Your task is to implement the following specific request: $TASK_INPUT. Make real file edits, run 'bun run lint' and 'bun x tsc --noEmit' and fix all errors, and check off any completed tasks in docs/plans/implementation-plan.md. Do NOT run bun build or bun dev. Do not run git commit, git push, or gh commands yourself — the workflow handles version control and PR creation."
          fi
          
          ./kilocode-runner.sh "$PROMPT"

      - name: Local Pre-Push Verification Loop
        run: |
          MAX_RETRIES=3
          COUNT=0
          # Auto-fix formatting/lint issues that Biome can resolve
          bun run format
          bun run lint --write || true
          until bun run lint 2>&1 && bun x tsc --noEmit 2>&1; do
            COUNT=$((COUNT+1))
            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "Local verification failed after $MAX_RETRIES attempts. Halting push."
              exit 1
            fi
            # Try Biome auto-fix again before re-prompting the agent
            bun run format
            bun run lint --write || true
            BUILD_ERRORS=$((bun run lint && bun x tsc --noEmit) 2>&1 | tail -n 40)
            ./kilocode-runner.sh \
              "The previous code changes failed local linting or type-checking: $BUILD_ERRORS. Fix all local errors."
          done

      - name: Generate PR Metadata with Kilo Code
        run: |
          ./kilocode-runner.sh "You are a release-notes writer for this project. Inspect the changes with 'git --no-pager diff HEAD' and 'git status --short'. Based strictly on the actual diff, write three files (do NOT use gh or git commit yourself): pr_title.txt — a single concise Conventional Commits style line (e.g. 'feat: add wakeup cooldown checker'), no surrounding quotes; pr_body.md — a clear markdown PR description of what changed and why, plus notes for reviewers; commit_msg.txt — a Conventional Commits message (subject, blank line, optional short body)."

      - name: Commit & Push Branch
        run: |
          git add -A
          git restore --staged pr_title.txt pr_body.md commit_msg.txt 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes made by agent."
            exit 1
          fi
          if [ -f commit_msg.txt ]; then
            git commit -F commit_msg.txt
          else
            git commit -m "feat: Autonomous Next Phase [Kilo Code Bot]"
          fi
          git pull --rebase origin "$BRANCH_NAME" || true
          git push origin "$BRANCH_NAME"
          rm -f pr_title.txt pr_body.md commit_msg.txt 2>/dev/null || true

      - name: Create Pull Request & Initialize Optimistic State
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -f pr_title.txt ] && [ -f pr_body.md ]; then
            PR_URL=$(gh pr create --title "$(cat pr_title.txt)" --body-file pr_body.md --head "$BRANCH_NAME" --base "main")
          else
            PR_URL=$(gh pr create --title "Autonomous Next Phase" --body "Autonomous PR created by Kilo Code Builder Agent." --head "$BRANCH_NAME" --base "main")
          fi
          
          PR_NUMBER=$(echo "$PR_URL" | awk -F'/' '{print $NF}')
          HEAD_SHA=$(git rev-parse HEAD)

          INITIAL_STATE=$(cat <<EOF
          <!-- ORCHESTRATOR_STATE:
          {
            "version": 1,
            "run_id": "task-$(date +%s)",
            "pr_number": $PR_NUMBER,
            "head_sha": "$HEAD_SHA",
            "branch": "$BRANCH_NAME",
            "phase": "WAITING_FOR_REVIEWS",
            "review_round": 1,
            "reviews": {
              "required": ["coderabbitai", "cubic-dev-ai", "sourcery-ai"],
              "completed": {},
              "post_fix_rounds": 0
            },
            "deployment": {
              "status": "pending",
              "sha": "$HEAD_SHA"
            },
            "gates": {
              "deployment_passed": false,
              "reviews_passed": false
            },
            "attempts": {
              "total_agent_runs": 1,
              "max_limit": 10
            },
            "processed_event_ids": []
          }
          -->
          EOF
          )

          gh pr comment "$PR_NUMBER" --body "$INITIAL_STATE"$'\n'"🤖 **Autonomous Orchestrator Initialized (Version 1).**"

      - name: Generate GitHub Step Summary
        run: |
          TASK_DESC="${{ inputs.task }}"
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### 🚀 Kilo Code Builder Agent Execution Completed
          - **Branch:** \`${{ env.BRANCH_NAME }}\`
          - **Task:** ${TASK_DESC:-Start Next Phase}
          - **Local Pre-Push Verification:** Passed (\`bun run lint && bun x tsc --noEmit\`)
          EOF