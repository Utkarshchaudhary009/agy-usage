name: "6. Orchestrator: Quality Gate & Auto-Merger"

on:
  repository_dispatch:
    types: [check-merge-gate]

jobs:
  evaluate-gates-and-merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Validate Quality Gates & Squash Merge
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.client_payload.pr_number;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const stateComment = comments.data.find(c => c.body.includes('<!-- ORCHESTRATOR_STATE:'));
            if (!stateComment) return;

            let state = JSON.parse(stateComment.body.match(/<!-- ORCHESTRATOR_STATE:\s*({[\s\S]*?})\s*-->/)[1]);

            const deploymentOk = state.gates.deployment_passed === true;
            const reviewsOk = state.gates.reviews_passed === true;
            const underLimit = state.attempts.total_agent_runs <= state.attempts.max_limit;

            if (deploymentOk && reviewsOk && underLimit) {
              state.phase = 'MERGED';
              state.version = (state.version || 1) + 1;

              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: stateComment.id,
                body: `<!-- ORCHESTRATOR_STATE:\n${JSON.stringify(state, null, 2)}\n-->\n🎉 **All Quality Gates Passed!** Merging Pull Request automatically...`
              });

              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'squash'
              });
            } else {
              console.log(`Gates Pending — Deployment Passed: ${deploymentOk}, Reviews Passed: ${reviewsOk}`);
            }

      - name: Generate Summary Card
        run: |
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### 🏁 Quality Gate Status Evaluation
          - **Deployment Gate:** Passed
          - **AI Review Gate:** Passed
          - **Action:** Merge Triggered
          EOF