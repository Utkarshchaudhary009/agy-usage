name: "3. Pipeline (Fix + Merge)"

on:
  repository_dispatch:
    types: [trigger-fixer, trigger-vercel-debugger, check-merge-gate]

jobs:
  # ── Fixer (works review-bot feedback directly, no judge) ──────
  fix:
    if: github.event.action == 'trigger-fixer' || github.event.action == 'trigger-vercel-debugger'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve PR Branch
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          BRANCH=$(gh pr view ${{ github.event.client_payload.pr_number }} --json headRefName -q .headRefName)
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - uses: ./.github/actions/agent-setup

      - name: Fetch Vercel Build Logs
        if: github.event.action == 'trigger-vercel-debugger'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${{ github.event.client_payload.deployment_id }}/builds" > raw_logs.json
          jq -r '.[] | select(.type == "stderr" or (.text | contains("Error"))) | .text' raw_logs.json | tail -n 60 > clean_logs.txt || cat raw_logs.json > clean_logs.txt

      - name: Run Fixer Agent
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.client_payload.pr_number }}
          if [ "${{ github.event.action }}" == "trigger-vercel-debugger" ]; then
            ./kilocode-runner.sh "You are a Senior Developer. Fix these Vercel build errors: $(cat clean_logs.txt). Do not commit or push."
          elif [ "${{ github.event.client_payload.post_fix }}" == "true" ]; then
            ./kilocode-runner.sh "You are a Senior Developer. Check the reviews in PR $PR_NUMBER again and verify all mentioned issues are fixed. Fix any remaining. Do not commit or push."
          else
            ./kilocode-runner.sh "You are a Senior Developer. Check the reviews in PR $PR_NUMBER and fix all the mentioned issues. Do not commit or push."
          fi

      - name: Commit & Push
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "kilocode-bot"
          git config user.email "bot@kilocode.ai"
          git update-index --no-skip-worktree AGENTS.md || true
          git checkout -- AGENTS.md || true
          git update-index --skip-worktree AGENTS.md || true
          git add -A
          if git diff --staged --quiet; then
            echo "No code changes applied."
            exit 0
          fi
          git commit -m "fix: autonomous fix applied [Kilo Code Bot]"
          git pull --rebase origin "$BRANCH" || true
          git push origin "$BRANCH"
          echo "NEW_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Advance State & Re-dispatch
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.client_payload.pr_number;
            const newSha = process.env.NEW_SHA;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber
            });
            const sc = comments.find(c => c.body.includes('<!-- ORCHESTRATOR_STATE:'));
            if (!sc) return;
            const state = JSON.parse(sc.body.match(/<!-- ORCHESTRATOR_STATE:\s*({[\s\S]*?})\s*-->/)[1]);

            if (newSha) state.head_sha = newSha;
            state.review_round += 1;
            state.attempts.total_agent_runs += 1;
            state.version = (state.version || 1) + 1;

            const action = context.payload.action;
            let nextEvent = null;
            let note = '';

            if (action === 'trigger-vercel-debugger') {
              note = 'Deployment fix pushed. Waiting for Vercel status.';
            } else {
              state.reviews.completed = {};
              state.reviews.post_fix_rounds = (state.reviews.post_fix_rounds || 0) + 1;
              const postFixRounds = state.reviews.post_fix_rounds;
              if (state.attempts.total_agent_runs >= state.attempts.max_limit) {
                state.phase = 'NEEDS_HUMAN';
                note = 'Max agent runs reached. Escalating to human.';
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: prNumber,
                  body: 'Max agent runs reached. Escalating to human.'
                });
              } else if (postFixRounds >= 2) {
                state.phase = 'REVIEWS_APPROVED';
                state.gates.reviews_passed = true;
                nextEvent = 'check-merge-gate';
                note = 'Review rounds complete. Approving and merging.';
              } else {
                state.phase = 'VERIFYING_FIX';
                nextEvent = 'trigger-fixer';
                note = `Fix pushed (round ${state.review_round}): re-checking (post-fix round ${postFixRounds}/2).`;
              }
            }

            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: sc.id,
              body: `<!-- ORCHESTRATOR_STATE:\n${JSON.stringify(state, null, 2)}\n-->\n${note}`
            });

            if (nextEvent) {
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner, repo: context.repo.repo,
                event_type: nextEvent,
                client_payload: { pr_number: prNumber, head_sha: newSha, post_fix: true }
              });
            }

  # ── Merge Gate ────────────────────────────────────────────────
  merge:
    if: github.event.action == 'check-merge-gate'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Evaluate Gates & Squash Merge
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.client_payload.pr_number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber
            });
            const sc = comments.find(c => c.body.includes('<!-- ORCHESTRATOR_STATE:'));
            if (!sc) return;

            const state = JSON.parse(sc.body.match(/<!-- ORCHESTRATOR_STATE:\s*({[\s\S]*?})\s*-->/)[1]);

            if (state.gates.deployment_passed && state.gates.reviews_passed
                && state.attempts.total_agent_runs <= state.attempts.max_limit) {
              state.phase = 'MERGED';
              state.version = (state.version || 1) + 1;
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: sc.id,
                body: `<!-- ORCHESTRATOR_STATE:\n${JSON.stringify(state, null, 2)}\n-->\nAll Quality Gates Passed! Merging...`
              });
              await github.rest.pulls.merge({
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: prNumber, merge_method: 'squash'
              });
            }
