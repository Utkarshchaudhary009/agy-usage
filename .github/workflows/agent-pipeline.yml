name: "3. Pipeline (Judge + Fix + Merge)"

on:
  repository_dispatch:
    types: [trigger-review-judge, trigger-fixer, trigger-vercel-debugger, check-merge-gate]

jobs:
  # ── Judge ─────────────────────────────────────────────────────
  judge:
    if: github.event.action == 'trigger-review-judge'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.head_sha }}

      - uses: ./.github/actions/agent-setup

      - name: Fetch PR Reviews
        if: ${{ github.event.client_payload.post_fix != true }}
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh pr view ${{ github.event.client_payload.pr_number }} --json reviews,comments > pr_reviews.json

      - name: Run Judge Agent
        run: |
          if [ "${{ github.event.client_payload.post_fix }}" == "true" ]; then
            PROMPT="You are the Review Judge Agent (POST-FIX verification). Do a FRESH code review (run 'git --no-pager diff origin/main...HEAD'). Verify issues are resolved and no new blockers exist. Output JSON to 'findings.json': { \"status\": \"changes_required\" | \"approved\", \"findings\": [ { \"file\": \"...\", \"problem\": \"...\", \"action\": \"...\" } ] }. Set status to \"approved\" with empty findings if everything is correct."
          else
            PROMPT="You are the Review Judge Agent. PR Reviews: $(cat pr_reviews.json). Analyze all reviews, filter duplicates and false positives. Output JSON to 'findings.json': { \"status\": \"changes_required\" | \"approved\", \"findings\": [ { \"file\": \"...\", \"problem\": \"...\", \"action\": \"...\" } ] }"
          fi
          ./kilocode-runner.sh "$PROMPT"

      - name: Parse & Route Decision
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prNumber = context.payload.client_payload.pr_number;
            const isPostFix = context.payload.client_payload.post_fix === true;

            let result = { status: "approved", findings: [] };
            if (fs.existsSync('findings.json')) {
              try {
                const match = fs.readFileSync('findings.json', 'utf8').match(/([\s\S]*\})/);
                if (match) result = JSON.parse(match[0]);
              } catch (e) { console.warn("Parse failed, defaulting to approved.", e); }
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber
            });
            const sc = comments.find(c => c.body.includes('<!-- ORCHESTRATOR_STATE:'));
            const state = JSON.parse(sc.body.match(/<!-- ORCHESTRATOR_STATE:\s*({[\s\S]*?})\s*-->/)[1]);

            const postFixRounds = state.reviews.post_fix_rounds || 0;
            const needsFix = result.status === 'changes_required' && result.findings.length > 0;

            if (needsFix && !(isPostFix && postFixRounds >= 2)) {
              state.phase = 'FIXING_REVIEWS';
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner, repo: context.repo.repo,
                event_type: 'trigger-fixer',
                client_payload: { pr_number: prNumber, findings: result.findings }
              });
            } else {
              state.phase = 'REVIEWS_APPROVED';
              state.gates.reviews_passed = true;
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner, repo: context.repo.repo,
                event_type: 'check-merge-gate',
                client_payload: { pr_number: prNumber }
              });
            }

            state.version = (state.version || 1) + 1;
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: sc.id,
              body: `<!-- ORCHESTRATOR_STATE:\n${JSON.stringify(state, null, 2)}\n-->\nJudge Decision: \`${result.status}\`${isPostFix ? ` (post-fix round ${postFixRounds}/2)` : ''}`
            });

  # ── Fixer (self-verifying — no external loop) ─────────────────
  fix:
    if: github.event.action == 'trigger-fixer' || github.event.action == 'trigger-vercel-debugger'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve PR Branch
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          BRANCH=$(gh pr view ${{ github.event.client_payload.pr_number }} --json headRefName -q .headRefName)
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - uses: ./.github/actions/agent-setup

      - name: Fetch Vercel Build Logs
        if: github.event.action == 'trigger-vercel-debugger'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${{ github.event.client_payload.deployment_id }}/builds" > raw_logs.json
          jq -r '.[] | select(.type == "stderr" or (.text | contains("Error"))) | .text' raw_logs.json | tail -n 60 > clean_logs.txt || cat raw_logs.json > clean_logs.txt

      - name: Run Fixer Agent (self-verifying)
        run: |
          VERIFY="After fixing, self-verify: run 'bun run format', 'bun run lint --write', 'bun run lint', and 'bun x tsc --noEmit'. If any fail, fix and re-run until ALL pass clean. Do not run git commit, git push, or gh commands — the workflow handles version control."
          if [ "${{ github.event.action }}" == "trigger-fixer" ]; then
            ./kilocode-runner.sh \
              "You are the Review Fixer Agent. Findings to fix: '${{ toJson(github.event.client_payload.findings) }}'. Fix valid findings. $VERIFY"
          else
            ./kilocode-runner.sh \
              "You are the Vercel Debugger Agent. Build Logs: $(cat clean_logs.txt). Fix the build/runtime errors. $VERIFY"
          fi

      - name: Commit & Push
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "kilocode-bot"
          git config user.email "bot@kilocode.ai"
          git add -A
          if git diff --staged --quiet; then
            echo "No code changes applied."
            exit 0
          fi
          git commit -m "fix: autonomous fix applied [Kilo Code Bot]"
          git pull --rebase origin "$BRANCH" || true
          git push origin "$BRANCH"
          echo "NEW_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Re-verify via Judge
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.client_payload.pr_number;
            const newSha = process.env.NEW_SHA;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber
            });
            const sc = comments.find(c => c.body.includes('<!-- ORCHESTRATOR_STATE:'));
            const state = JSON.parse(sc.body.match(/<!-- ORCHESTRATOR_STATE:\s*({[\s\S]*?})\s*-->/)[1]);

            state.head_sha = newSha;
            state.review_round += 1;
            state.reviews.completed = {};
            state.reviews.post_fix_rounds = (state.reviews.post_fix_rounds || 0) + 1;
            state.attempts.total_agent_runs += 1;
            state.version = (state.version || 1) + 1;

            let nextEvent = null;
            if (state.attempts.total_agent_runs >= state.attempts.max_limit) {
              state.phase = 'NEEDS_HUMAN';
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prNumber,
                body: 'Max agent runs reached. Escalating to human.'
              });
            } else {
              state.phase = 'VERIFYING_FIX';
              nextEvent = 'trigger-review-judge';
            }

            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: sc.id,
              body: `<!-- ORCHESTRATOR_STATE:\n${JSON.stringify(state, null, 2)}\n-->\nFix Pushed (round ${state.review_round}): Re-verifying (post-fix round ${state.reviews.post_fix_rounds}/2).`
            });

            if (nextEvent) {
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner, repo: context.repo.repo,
                event_type: nextEvent,
                client_payload: { pr_number: prNumber, head_sha: newSha, post_fix: true }
              });
            }

  # ── Merge Gate ────────────────────────────────────────────────
  merge:
    if: github.event.action == 'check-merge-gate'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Evaluate Gates & Squash Merge
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.client_payload.pr_number;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber
            });
            const sc = comments.find(c => c.body.includes('<!-- ORCHESTRATOR_STATE:'));
            if (!sc) return;

            const state = JSON.parse(sc.body.match(/<!-- ORCHESTRATOR_STATE:\s*({[\s\S]*?})\s*-->/)[1]);

            if (state.gates.deployment_passed && state.gates.reviews_passed
                && state.attempts.total_agent_runs <= state.attempts.max_limit) {
              state.phase = 'MERGED';
              state.version = (state.version || 1) + 1;
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: sc.id,
                body: `<!-- ORCHESTRATOR_STATE:\n${JSON.stringify(state, null, 2)}\n-->\nAll Quality Gates Passed! Merging...`
              });
              await github.rest.pulls.merge({
                owner: context.repo.owner, repo: context.repo.repo,
                pull_number: prNumber, merge_method: 'squash'
              });
            }
