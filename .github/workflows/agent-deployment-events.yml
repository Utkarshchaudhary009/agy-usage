name: "4. Orchestrator: Deployment Event Listener"

on:
  deployment_status:

jobs:
  handle-deployment-status:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Process Vercel Deployment Event
        uses: actions/github-script@v7
        with:
          script: |
            const status = context.payload.deployment_status;
            const deployment = context.payload.deployment;
            const targetSha = deployment.sha;
            const eventId = `dpl_${status.id}_${status.state}`;

            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open'
            });

            const matchingPr = prs.data.find(pr => pr.head.sha === targetSha);
            if (!matchingPr) return;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: matchingPr.number
            });

            const stateComment = comments.data.find(c => c.body.includes('<!-- ORCHESTRATOR_STATE:'));
            if (!stateComment) return;

            let state = JSON.parse(stateComment.body.match(/<!-- ORCHESTRATOR_STATE:\s*({[\s\S]*?})\s*-->/)[1]);

            if (state.processed_event_ids.includes(eventId)) return;
            state.processed_event_ids.push(eventId);

            state.deployment = {
              status: status.state,
              sha: targetSha,
              id: deployment.id
            };

            if (status.state === 'success') {
              state.gates.deployment_passed = true;
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: 'check-merge-gate',
                client_payload: { pr_number: matchingPr.number }
              });
            } else if (['failure', 'error'].includes(status.state)) {
              state.gates.deployment_passed = false;
              state.phase = 'FIXING_DEPLOYMENT';
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: 'trigger-vercel-debugger',
                client_payload: { pr_number: matchingPr.number, deployment_id: deployment.id }
              });
            }

            state.version = (state.version || 1) + 1;
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: stateComment.id,
              body: `<!-- ORCHESTRATOR_STATE:\n${JSON.stringify(state, null, 2)}\n-->\n🚀 **Vercel Status Updated:** \`${status.state}\``
            });