name: "5. Orchestrator: Fixer & Debugger Agent"

on:
  repository_dispatch:
    types: [trigger-fixer, trigger-vercel-debugger]

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Fetch PR Branch Name
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          BRANCH=$(gh pr view ${{ github.event.client_payload.pr_number }} --json headRefName -q .headRefName)
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Project Dependencies
        run: bun install

      - name: Install Kilo Code CLI
        run: |
          npm install -g @kilocode/cli@latest
          chmod +x kilocode-runner.sh

      - name: Fetch & Sanitize Vercel Build Logs
        if: github.event.action == 'trigger-vercel-debugger'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v13/deployments/${{ github.event.client_payload.deployment_id }}/builds" > raw_logs.json
          
          # Sanitize logs: Filter to keep only error traces to save context
          jq -r '.[] | select(.type == "stderr" or (.text | contains("Error"))) | .text' raw_logs.json | tail -n 60 > clean_logs.txt || cat raw_logs.json > clean_logs.txt

      - name: Run Kilo Code Fixer Agent
        run: |
          if [ "${{ github.event.action }}" == "trigger-fixer" ]; then
            ./kilocode-runner.sh \
              "You are the Review Fixer Agent. Findings to fix: '${{ toJson(github.event.client_payload.findings) }}'. Fix valid findings. Do not run git commit, git push, or gh commands yourself — the workflow handles version control."
          else
            ./kilocode-runner.sh \
              "You are the Vercel Debugger Agent. Build Logs: $(cat clean_logs.txt). Fix the build/runtime errors. Do not run git commit, git push, or gh commands yourself — the workflow handles version control."
          fi

      - name: Local Pre-Push Verification Loop
        run: |
          MAX_RETRIES=3
          COUNT=0
          # Auto-fix formatting/lint issues that Biome can resolve
          bun run format
          bun run lint --write || true
          until bun run lint 2>&1 && bun x tsc --noEmit 2>&1; do
            COUNT=$((COUNT+1))
            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "Local verification failed after $MAX_RETRIES attempts. Halting push."
              exit 1
            fi
            # Try Biome auto-fix again before re-prompting the agent
            bun run format
            bun run lint --write || true
            BUILD_ERRORS=$((bun run lint && bun x tsc --noEmit) 2>&1 | tail -n 40)
            ./kilocode-runner.sh \
              "Local verification failed during pre-push gate: $BUILD_ERRORS. Fix the lint and TypeScript errors."
          done

      - name: Commit, Push & Update State
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "kilocode-bot"
          git config user.email "bot@kilocode.ai"
          git add -A
          if git diff --staged --quiet; then
            echo "No code changes applied."
            exit 0
          fi
          git commit -m "fix: autonomous fix applied [Kilo Code Bot]"
          git pull --rebase origin "$BRANCH" || true
          git push origin "$BRANCH"
          echo "NEW_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Re-verify Fix (post-fix judge)
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.client_payload.pr_number;
            const newSha = process.env.NEW_SHA;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });
            const stateComment = comments.data.find(c => c.body.includes('<!-- ORCHESTRATOR_STATE:'));
            let state = JSON.parse(stateComment.body.match(/<!-- ORCHESTRATOR_STATE:\s*({[\s\S]*?})\s*-->/)[1]);

            state.head_sha = newSha;
            state.review_round += 1;
            state.reviews.completed = {};
            state.reviews.post_fix_rounds = (state.reviews.post_fix_rounds || 0) + 1;
            state.attempts.total_agent_runs += 1;
            state.version = (state.version || 1) + 1;

            let nextEvent = null;
            if (state.attempts.total_agent_runs >= state.attempts.max_limit) {
              state.phase = 'NEEDS_HUMAN';
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: '⚠️ Max agent runs reached. Escalating to human.'
              });
            } else {
              state.phase = 'VERIFYING_FIX';
              nextEvent = 'trigger-review-judge';
            }

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: stateComment.id,
              body: `<!-- ORCHESTRATOR_STATE:\n${JSON.stringify(state, null, 2)}\n-->\n🔄 **Fix Pushed (round ${state.review_round}):** Re-verifying (post-fix round ${state.reviews.post_fix_rounds}/2).`
            });

            if (nextEvent) {
              await github.rest.repos.createDispatchEvent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                event_type: nextEvent,
                client_payload: { pr_number: prNumber, head_sha: newSha, post_fix: true }
              });
            }
