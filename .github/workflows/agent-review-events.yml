name: "2. Orchestrator: Review Event Listener (Optimistic Lock)"

on:
  pull_request_review:
    types: [submitted]

jobs:
  process-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Update Review State with Optimistic Concurrency Control
        uses: actions/github-script@v7
        with:
          script: |
            const review = context.payload.review;
            const pr = context.payload.pull_request;
            const reviewer = review.user.login;
            const eventId = `review_${review.id}`;

            let retries = 3;
            let success = false;

            while (retries > 0 && !success) {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number
              });

              const stateComment = comments.data.find(c => c.body.includes('<!-- ORCHESTRATOR_STATE:'));
              if (!stateComment) return;

              let state = JSON.parse(stateComment.body.match(/<!-- ORCHESTRATOR_STATE:\s*({[\s\S]*?})\s*-->/)[1]);

              // Idempotency check
              if (state.processed_event_ids.includes(eventId)) {
                console.log("Event already processed. Exiting.");
                return;
              }

              // Commit SHA check
              if (pr.head.sha !== state.head_sha) {
                console.log("Review is for an outdated commit SHA. Ignoring.");
                return;
              }

              if (state.reviews.required.includes(reviewer)) {
                state.reviews.completed[reviewer] = {
                  state: review.state,
                  timestamp: new Date().toISOString()
                };
                state.processed_event_ids.push(eventId);
              }

              const completedList = Object.keys(state.reviews.completed);
              const allComplete = state.reviews.required.every(r => completedList.includes(r));

              if (allComplete && state.phase === 'WAITING_FOR_REVIEWS') {
                state.phase = 'JUDGING_REVIEWS';
              }

              state.version = (state.version || 1) + 1;

              try {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: stateComment.id,
                  body: `<!-- ORCHESTRATOR_STATE:\n${JSON.stringify(state, null, 2)}\n-->\n📊 **Review Tracked:** \`${reviewer}\` submitted \`${review.state}\` (v${state.version}).`
                });
                success = true;

                if (allComplete) {
                  await github.rest.repos.createDispatchEvent({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    event_type: 'trigger-review-judge',
                    client_payload: { pr_number: pr.number, head_sha: pr.head.sha }
                  });
                }
              } catch (err) {
                retries--;
                console.warn(`Concurrency collision updating comment. Retrying (${retries} attempts left)...`);
                await new Promise(r => setTimeout(r, 1000));
              }
            }